<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>JeyPeeh | Software Developer & Digital Creative</title>

    <meta
      name="description"
      content="Portfolio of Juan Pablo García Hernández, also known as JeyPeeh. Software developer, digital creative, web designer, app developer, and music producer from León, Guanajuato."
    />

    <meta name="author" content="Juan Pablo García Hernández" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://jeypeeh.com/" />

    <!-- Favicon dinámico según el tema del sistema -->
    <link
      id="favicon"
      rel="icon"
      type="image/png"
      href="/img/LogojeypeehWhite.png"
    />
    <link
      rel="apple-touch-icon"
      href="/img/LogojeypeehWhite.png"
    />

    <meta property="og:title" content="JeyPeeh | Software Developer & Digital Creative" />
    <meta
      property="og:description"
      content="Portfolio of Juan Pablo García Hernández. Software development, web design, apps, projects, and music."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jeypeeh.com/" />
    <meta property="og:image" content="https://jeypeeh.com/img/LogojeypeehWhite.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JeyPeeh | Software Developer & Digital Creative" />
    <meta
      name="twitter:description"
      content="Software developer, digital creative, web designer, app developer, and music producer."
    />
    <meta name="twitter:image" content="https://jeypeeh.com/img/LogojeypeehWhite.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juan Pablo García Hernández",
        "alternateName": "JeyPeeh",
        "url": "https://jeypeeh.com/",
        "image": "https://jeypeeh.com/img/LogojeypeehWhite.png",
        "jobTitle": "Software Developer",
        "sameAs": [
          "https://github.com/jeezly"
        ]
      }
    </script>

    <script>
      (() => {
        const lightIcon = "/img/LogojeypeehWhite.png";
        const darkIcon = "/img/LogoJeypeeh.png";
        const media = window.matchMedia("(prefers-color-scheme: dark)");

        const updateFavicon = (isDark) => {
          const favicon = document.getElementById("favicon");
          if (favicon) {
            favicon.href = isDark ? darkIcon : lightIcon;
          }
        };

        updateFavicon(media.matches);

        if (media.addEventListener) {
          media.addEventListener("change", (event) => {
            updateFavicon(event.matches);
          });
        } else if (media.addListener) {
          media.addListener((event) => {
            updateFavicon(event.matches);
          });
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
